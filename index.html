
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Aplikasi Presensi Musyrif</title>
      <meta name="description" content="This app enables authorized users to log attendance for morning and afternoon prayers, allowing oversight and daily tracking of participants." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="theme-color" content="#059669" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Presensi Musyrif" />
      <link rel="manifest" href="/presensi/manifest.webmanifest" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <style>
        html, body { height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        #root { height: 100%; }
        .font-mono { font-family: 'JetBrains Mono', monospace !important; }
      </style>
      <script src="https://accounts.google.com/gsi/client" async defer></script>
      <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            const swPath = window.location.pathname.startsWith('/presensi') ? '/presensi/sw.js' : '/sw.js';
            navigator.serviceWorker.register(swPath).catch((err) => {
              console.log('SW registration skipped or failed:', err);
            });
          });
        }
      </script>
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
